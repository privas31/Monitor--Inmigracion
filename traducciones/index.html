<style>
.ta{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;resize:vertical;background:#fff}

.ok{color:var(--ok);font-weight:800}
.ol:hover{background:#eff4ff}
</style>

    <div class="brand"><span class="logo">⇄</span>TraduDoc</div>

    <a href="../" style="display:block;margin:14px 10px 0;padding:10px 12px;border-radius:10px;color:#cfd9ea;text-decoration:none;border:1px solid rgba(255,255,255,.12);font-size:13px">← Volver al monitor</a>
    <div class="foot">Las actas se procesan en este navegador. No se envían a ningún servidor.</div>
  </aside>
  <main class="main" id="view" style="max-width:1500px"></main>
</div>
